resources:
  jobs:
    setup:
      name: sdp-rewind-setup
      tasks:
        - task_key: create_landing_table
          notebook_task:
            notebook_path: ../src/setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.demo_schema}
              landing_table: ${var.landing_table}

# There is deliberately no seeding job here. Seeding is scripts/feed.py, run from
# the laptop over the SQL statement API: a batch lands in about a second, where a
# notebook job spent 20-40s per run waiting for serverless compute to start.
#
# The old seed_stream job also chained a pipeline_task to run the pipeline after
# each batch, which the pipeline being continuous now makes redundant: it runs
# itself. Two seeders and two ways to trigger an update was one too many of each.
