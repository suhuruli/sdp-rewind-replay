resources:
  jobs:
    setup:
      name: sdp-rewind-setup
      tasks:
        - task_key: create_landing_table
          notebook_task:
            notebook_path: ../src/setup.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.demo_schema}

    # Keeps data continuously arriving so the pipeline looks like a live production
    # stream rather than a table someone loaded by hand. Also the mechanism that
    # accumulates rewind points: they are generated roughly hourly, and a pipeline
    # has nothing to rewind to until it has run long enough to produce one.
    #
    # Paused on deploy. Unpause when you want the stream running, and leave it
    # running during a rewind to show new data still landing while recovery happens.
    seed_stream:
      name: sdp-rewind-seed-stream
      schedule:
        quartz_cron_expression: "0 */5 * * * ?"
        timezone_id: UTC
        pause_status: PAUSED
      max_concurrent_runs: 1
      tasks:
        - task_key: seed
          notebook_task:
            notebook_path: ../src/seed.py
            base_parameters:
              catalog: ${var.catalog}
              schema: ${var.demo_schema}
              events_per_run: "400"
              spread_minutes: "12"
              lag_minutes: "20"

        # The pipeline is triggered, not continuous, so something has to run it.
        # Chaining it to the seeder keeps landing, bronze, silver, and gold moving
        # together on one cadence.
        - task_key: run_pipeline
          depends_on:
            - task_key: seed
          pipeline_task:
            pipeline_id: ${resources.pipelines.payments_pipeline.id}
